name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest ではなく版を固定する: 2026-11 に ubuntu-latest が 26.04 に切り替わり、
    # Playwright 1.55.1 が `playwright install --with-deps chromium` で
    # "does not support chromium on ubuntu26.04-x64" と失敗した (コードは無変更で CI が赤に)。
    # 上げる条件: Playwright を 26.04 対応の版に上げたとき、または 24.04 のイメージが廃止予告されたとき。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (jsdom)
        run: npm test

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright/chromium)
        run: npm run test:browser

      - name: Docs site i18n check (every t() key has a ja entry)
        run: npm run check:i18n

      - name: Examples + docs site smoke (Playwright/chromium)
        run: npm run test:examples

      - name: Build
        run: npm run build
