<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ricdom — Examples</title>
<link rel="stylesheet" href="../dist/ricdom-ui.css">
<link rel="stylesheet" href="_fonts.css">
<style>
  main { padding: 2rem; max-width: 720px; }
  h1 { font-size: 1.3rem; }
  ol { padding-left: 0; list-style: none; }
  li { margin: 0.9rem 0; display: flex; gap: 0.8rem; align-items: baseline; }
  .num { font-variant-numeric: tabular-nums; color: var(--ric-color-fg-muted); min-width: 2ch; }
  .blurb { display: block; color: var(--ric-color-fg-muted); font-size: 0.9rem; }
  a { color: var(--ric-color-accent); }
</style>
</head>
<body>
<!--
  Every demo opens directly in a browser, no build step: each loads ../dist/ricdom.iife.min.js
  (and, where used, ../dist/ricdom-ui.iife.min.js + ../dist/ricdom-ui.css) with plain
  <script>/<link> tags. Run `npm run build` once so dist/ exists, then open any page.

  This list is rendered from _samples.js, the same source the nav bar uses for previous/next.
  `Home` points at the docs-site landing page, which exists in the output of `npm run build:site`.
-->
<main>
  <div id="app"></div>
</main>

<script src="../dist/ricdom.iife.min.js"></script>
<script src="../dist/ricdom-ui.iife.min.js"></script>
<script src="_i18n.js"></script><script src="_samples.js"></script>
<script>window.RICDOM_NAV_OPTIONS = { links: [{ href: '../index.html', label: 'Home' }], source: false, samples: false };</script>
<script src="_nav.js"></script>
<script>
  const { t, addDict, onLangChange, getLang } = ricdomI18n;

  addDict('ja', {
    'ricdom examples': 'ricdom サンプル',
    'Build-free demo pages. Each one opens directly in a browser: no npm install, no bundler.':
      'ビルド不要のデモページ集です。どれもブラウザで直接開けます (npm install も bundler も不要)。',
  });

  const app = ricdom.createApp('#app', {}, () => {
    const lang = getLang();
    return {
      tag: 'div',
      children: [
        { tag: 'h1', children: [t('ricdom examples')] },
        { tag: 'p', children: [t('Build-free demo pages. Each one opens directly in a browser: no npm install, no bundler.')] },
        {
          tag: 'ol',
          children: RICDOM_SAMPLES.map((sample) => ({
            tag: 'li',
            key: sample.file,
            children: [
              { tag: 'span', class: 'num', children: [sample.file.slice(0, 2)] },
              {
                tag: 'span',
                children: [
                  { tag: 'a', href: sample.file, children: [sample.title[lang] || sample.title.en] },
                  { tag: 'span', class: 'blurb', children: [sample.blurb[lang] || sample.blurb.en] },
                ],
              },
            ],
          })),
        },
      ],
    };
  });

  onLangChange(() => app.renderNow());
</script>
</body>
</html>
