<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ricdom — 03 Forms and controls (no build step)</title>
<link rel="stylesheet" href="../dist/ricdom-ui.css">
<link rel="stylesheet" href="_fonts.css">
<style>
  h1 { font-size: 1.1rem; }
  h2 { font-size: 0.95rem; margin: 0 0 4px; }
</style>
</head>
<body>
<!--
  TODO (later wave): this page is split into 02 (basic inputs), 03 (forms) and 04 (layout and
  text); until then it carries all of them under the number 03.

  No build step for consumers (design goal G1): two IIFE bundles (ricdom -> ricdom/ui) and one
  CSS <link> show every control, layout and text component. All of them are pure functions, so
  no app.use() is needed.
-->
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="../dist/ricdom.iife.min.js"></script>
<script src="../dist/ricdom-ui.iife.min.js"></script>
<script src="_i18n.js"></script><script src="_samples.js"></script><script src="_nav.js"></script>
<script>
  // The IIFE builds are exposed as the globals `ricdom` / `ricdomUI` (globalName in tsup.config.ts).
  const U = ricdomUI;
  const { t, addDict, onLangChange } = ricdomI18n;

  addDict('ja', {
    'ricdom — controls': 'ricdom — コントロール一覧',
    'Name': '名前',
    'I agree to the terms of use': '利用規約に同意する',
    'Delete': '削除',
    'Heading': '見出し',
    '**bold**, *italic*, `code` and a [link](https://example.com)': '**太字**・*斜体*・`code`・[リンク](https://example.com)',
    'Item A': '項目 A',
    'Item B': '項目 B',
    'Step 1': '手順 1',
    'Step 2': '手順 2',
  });

  // Icon descriptors are fetched with `npx ricdom-icon <name>` (here: check, trash-2); do not hand-write them.
  const ICON_CHECK = { p: 'M20 6 9 17l-5-5' };
  const ICON_TRASH = { p: ['M3 6h18', 'M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6', 'M10 11v6', 'M14 11v6', 'M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2'] };

  const state = {
    name: 'Alex',
    memo: 'Notes can span\nseveral lines.',
    agree: true,
    role: 'editor',
    locale: 'ja',
    volume: 40,
    bg: '#2563eb',
    overlay: 'rgba(37,99,235,0.35)',
  };

  // `s` (the render argument) is the reactive state itself: a Proxy created by createApp.
  // Writing to the outer `state` object does not re-render; only writes through `s` do.
  const app = ricdom.createApp(
    '#app',
    state,
    (s) =>
      U.uiPanel({
        style: { maxWidth: '720px', margin: '2rem auto' },
        children: [
          { tag: 'h1', children: [t('ricdom — controls')] },
          U.uiSeparator(),

          U.uiCol({
            children: [
              { tag: 'h2', children: ['control'] },
              U.uiRow({
                children: [
                  U.bindInput(s, 'name', { placeholder: t('Name') }),
                  U.uiSelect({ value: s.role, options: ['viewer', 'editor', 'admin'], onchange: (e) => (s.role = e.target.value) }),
                ],
              }),
              U.bindTextarea(s, 'memo', { autoResize: { minRows: 2, maxRows: 6 } }),
              U.uiRow({
                children: [
                  U.bindCheckbox(s, 'agree', { children: [t('I agree to the terms of use')] }),
                  U.uiRadiobutton({
                    name: 'locale',
                    value: s.locale,
                    onchange: (e) => (s.locale = e.target.value),
                    options: [
                      { value: 'ja', label: [U.uiIcon(ICON_CHECK, { size: 16 }), ' 日本語'] },
                      { value: 'en', label: 'English' },
                    ],
                  }),
                ],
              }),
              U.uiRow({
                children: [
                  U.bindRange(s, 'volume', { min: 0, max: 100 }),
                  U.uiButton({ variant: 'ghost', children: [U.uiIcon(ICON_TRASH, { size: 16, label: t('Delete') })] }),
                ],
              }),
              U.uiRow({
                children: [U.uiColor({ value: s.bg, oninput: (e) => (s.bg = e.target.value) }), U.uiColor({ value: s.overlay, oninput: (e) => (s.overlay = e.target.value) })],
              }),
            ],
          }),

          U.uiSeparator(),

          U.uiCol({
            children: [
              { tag: 'h2', children: ['layout'] },
              U.uiGrid({
                columns: 3,
                gap: 8,
                children: [1, 2, 3, 4, 5, 6].map((n) => U.uiPanel({ layout: 'row', children: [String(n)] })),
              }),
            ],
          }),

          U.uiSeparator(),

          U.uiCol({
            children: [
              { tag: 'h2', children: ['text'] },
              U.uiMdPre({
                children: [
                  [
                    '# ' + t('Heading'),
                    '',
                    t('**bold**, *italic*, `code` and a [link](https://example.com)'),
                    '',
                    '- ' + t('Item A'),
                    '- ' + t('Item B'),
                    '',
                    '1. ' + t('Step 1'),
                    '2. ' + t('Step 2'),
                    '',
                    '```js',
                    "console.log('hello');",
                    '```',
                  ].join('\n'),
                ],
              }),
              U.uiCodePre({ obj: { role: s.role, volume: s.volume, locale: s.locale } }),
            ],
          }),
        ],
      }),
  );

  onLangChange(() => app.renderNow());
</script>
</body>
</html>
