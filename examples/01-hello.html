<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ricdom — 01 Hello (no build step)</title>
<!-- ricdom-ui.css is only here for the shared nav bar; the demo below uses the core alone. -->
<link rel="stylesheet" href="../dist/ricdom-ui.css">
<style>
  body { font-family: system-ui, sans-serif; }
  main { padding: 2rem; }
  button { font-size: 1.2rem; padding: 0.4rem 1rem; }
  output { font-size: 1.5rem; margin: 0 1rem; }
</style>
</head>
<body>
<!--
  No build step for consumers (design goal G1): a single <script src> is enough.
  No npm install, no bundler config: open this file in a browser and it runs.
-->
<main>
  <div id="app"></div>
</main>

<script src="../dist/ricdom.iife.min.js"></script>
<!-- The two scripts below (ui bundle + site helpers) exist only for the shared nav bar. -->
<script src="../dist/ricdom-ui.iife.min.js"></script>
<script src="_i18n.js"></script><script src="_samples.js"></script><script src="_nav.js"></script>
<script>
  const { t, addDict, onLangChange } = ricdomI18n;
  addDict('ja', {
    'A counter in one createApp call. Click + and -.': 'createApp 1 回で作ったカウンターです。+ と - を押してみてください。',
  });

  // The IIFE build is exposed as the global `ricdom` (globalName in tsup.config.ts).
  // createApp(target, state, render): where to draw, what data, how to draw it.
  const app = ricdom.createApp(
    '#app',
    { count: 0 },
    (s) => ({
      tag: 'div',
      children: [
        { tag: 'p', children: [t('A counter in one createApp call. Click + and -.')] },
        { tag: 'button', onclick: () => { s.count -= 1; }, children: ['-'] },
        { tag: 'output', children: [String(s.count)] },
        { tag: 'button', onclick: () => { s.count += 1; }, children: ['+'] },
      ],
    }),
  );
  // Strings read through t() are plain values, so re-render when the language changes.
  onLangChange(() => app.renderNow());
</script>
</body>
</html>
