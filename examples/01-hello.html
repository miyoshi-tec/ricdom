<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ricdom — 01 Hello (no build step)</title>
<!-- Site styling only: ricdom-ui.css draws the nav bar, _fonts.css sets the fonts. The counter below needs neither.
     サイトの見た目用です: ricdom-ui.css はナビバー、_fonts.css はフォントです。下のカウンターはどちらも使いません。 -->
<link rel="stylesheet" href="../dist/ricdom-ui.css">
<link rel="stylesheet" href="_fonts.css">
<style>
  main { padding: 2rem; }
  button { font-size: 1.2rem; padding: 0.4rem 1rem; }
  output { font-size: 1.5rem; margin: 0 1rem; }
</style>
</head>
<body>
<!--
  01 Hello: the smallest ricdom app, a counter.
  No build step: one <script> for ricdom is enough. No npm install, no bundler: open this file in a browser.

  01 Hello: いちばん小さな ricdom アプリ (カウンター) です。
  ビルド不要: ricdom の <script> 1 本で動きます。npm install もバンドラーも要りません。このファイルをブラウザで開くだけです。
-->
<main>
  <div id="app"></div>
</main>

<!-- Optional: highlight.js colours the code in this site's Source view. ricdom does not need it.
     任意: highlight.js はこのサイトの「ソース」表示を色分けします。ricdom 自体には不要です。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<!-- ricdom itself. It defines one global variable, ricdom.
     ricdom 本体です。グローバル変数 ricdom が 1 つできます。 -->
<script src="../dist/ricdom.iife.min.js"></script>
<!-- Docs-site helpers, not part of ricdom: the UI bundle and these three files only draw the nav bar (theme, language, previous / next page) and provide t() for translations.
     このサイト専用の補助で、ricdom の一部ではありません: UI 部品と下の 3 ファイルは、ナビバー (テーマ・言語・前後のページ) と翻訳用の t() のためだけに読み込んでいます。 -->
<script src="../dist/ricdom-ui.iife.min.js"></script>
<script src="_i18n.js"></script><script src="_samples.js"></script><script src="_nav.js"></script>
<script>
  // Site helper: t(text, { ja: '...' }) returns the text in the chosen language. A string used only
  // once carries its Japanese right there; strings used in several places go into addDict instead.
  // サイトの補助: t(文字列, { ja: '…' }) は選択中の言語の文字列を返します。1 回しか使わない文字列は
  // その場に日本語を書き、何度も使う文字列は addDict にまとめて登録します。
  const { t, onLangChange } = ricdomI18n;

  // createApp(target, state, render): where to draw, the data, and how to draw it.
  // render returns plain objects ({ tag, children, onclick, ... }) that describe the DOM.
  // createApp(描画先, 状態, render): どこに・どのデータを・どう描くか、の 3 つを渡します。
  // render は DOM の形を表す普通のオブジェクト ({ tag, children, onclick, ... }) を返します。
  const app = ricdom.createApp(
    '#app',
    { count: 0 },
    // `s` is the reactive state: assigning to s.count redraws the page by itself.
    // `s` はリアクティブな状態です。s.count に代入するだけで、画面が自動的に描き直されます。
    (s) => ({
      tag: 'div',
      children: [
        { tag: 'p', children: [t('A counter in one createApp call. Click + and -.', { ja: 'createApp 1 回で作ったカウンターです。+ と - を押してみてください。' })] },
        { tag: 'button', onclick: () => { s.count -= 1; }, children: ['-'] },
        { tag: 'output', children: [String(s.count)] },
        { tag: 'button', onclick: () => { s.count += 1; }, children: ['+'] },
      ],
    }),
  );

  // Site helper: t() returns a plain string, so draw again once when the language changes.
  // サイトの補助: t() の戻り値はただの文字列なので、言語が変わったら 1 回描き直します。
  onLangChange(() => app.renderNow());
</script>
</body>
</html>
