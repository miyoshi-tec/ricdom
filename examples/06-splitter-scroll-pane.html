<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ricdom — 06 Splitter and scroll pane (no build step)</title>
<!-- ricdom-ui.css styles ricdom's UI components (load it before your own CSS). _fonts.css only sets this site's fonts.
     ricdom-ui.css は ricdom の UI 部品の見た目です (自分の CSS より先に読み込みます)。_fonts.css はこのサイトのフォント設定だけです。 -->
<link rel="stylesheet" href="../dist/ricdom-ui.css">
<link rel="stylesheet" href="_fonts.css">
<style>
  .page { box-sizing: border-box; width: calc(100% - 2rem); max-width: 720px; margin: 1.5rem auto; }
  .page > h1 { font-size: 1.1rem; margin: 0; }
  .demo { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .demo > h2 { font-size: 0.95rem; margin: 0; }
  .demo > p { margin: 0; }
  .demo > .frame, .demo > .wide { align-self: stretch; }
  .frame { box-sizing: border-box; border: 1px solid var(--ric-color-border); border-radius: var(--ric-radius); }
  .pad { padding: 8px; }
  .wrap { flex-wrap: wrap; }
</style>
</head>
<body>
<!--
  06 Splitter and scroll pane: the two components that give an app screen its frame.
  createSplitter divides an area into a side panel and a main panel with a divider you can drag.
  createScrollPane is a scrolling area that keeps showing the newest content, like a chat or a log.
  Both keep state (the size, whether to follow), so each is registered with app.use().
  No build step: two scripts (ricdom, then ricdom/ui) and one stylesheet.

  06 スプリッターとスクロールペイン: アプリの画面の骨組みを作る 2 つの部品です。
  createSplitter は、領域をサイドパネルとメインパネルに分け、仕切り線をドラッグして大きさを変えられるようにします。
  createScrollPane は、チャットやログのように、いちばん新しい内容を表示し続けるスクロール領域です。
  どちらも状態 (大きさ、追従するかどうか) を持つので、それぞれ app.use() で登録します。
  ビルド不要: <script> 2 本 (ricdom → ricdom/ui) と CSS 1 本で動きます。
-->
<div id="app"></div>

<!-- Optional: highlight.js colours the code in this site's Source view. ricdom does not need it.
     任意: highlight.js はこのサイトの「ソース」表示を色分けします。ricdom 自体には不要です。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<!-- ricdom itself: the core first, then the UI components. They define the globals ricdom and ricdomUI.
     ricdom 本体: コア → UI 部品の順に読み込みます。グローバル変数 ricdom と ricdomUI ができます。 -->
<script src="../dist/ricdom.iife.min.js"></script>
<script src="../dist/ricdom-ui.iife.min.js"></script>
<!-- Docs-site helpers, not part of ricdom: the nav bar (theme, language, previous / next page) and t() for translations.
     このサイト専用の補助で、ricdom の一部ではありません: ナビバー (テーマ・言語・前後のページ) と翻訳用の t() です。 -->
<script src="_i18n.js"></script><script src="_samples.js"></script><script src="_nav.js"></script>
<script>
  // A short name for the UI components.
  // UI 部品を短い名前で呼べるようにします。
  const U = ricdomUI;

  // Site helper: t(text, { ja: '...' }) returns the text in the chosen language, with the Japanese
  // written where the string is used. addDict holds the t`...${value}...` forms, which put a value
  // into the text, and the strings chosen at run time (t(m.text) below): neither has one place
  // in the code to carry its Japanese.
  // サイトの補助: t(文字列, { ja: '…' }) は選択中の言語の文字列を返します。日本語は使う場所に書きます。
  // addDict には、値を差し込む t`…${値}…` の形と、実行時に決まる文字列 (下の t(m.text)) を登録します。
  // どちらも、日本語を書く場所がコードの 1 か所に決まらないためです。
  const { t, addDict, onLangChange } = ricdomI18n;
  addDict('ja', {
    'Side panel: {0}px (min 100, max 320)': 'サイドパネル: {0}px (最小 100、最大 320)',
    'Opened {0}': '{0} を開きました',
    'Contents of {0}': '{0} の中身',
    'Incoming message {0}': '届いたメッセージ {0}',
    // The first messages are kept as English text and translated when drawn, so a message the
    // user types (which has no entry here) is shown exactly as typed.
    // 最初のメッセージは英語のまま持ち、描画するときに翻訳します。
    // ユーザーが入力したメッセージ (ここに訳が無い) は、入力したとおりに表示されます。
    'Welcome!': 'ようこそ！',
    'Sending a message jumps to the newest one.': 'メッセージを送ると、最新のメッセージまで移動します。',
    'Scroll away to read older ones: new messages then leave the view where it is.': 'スクロールして古いメッセージを読んでいる間は、新しいメッセージが届いても表示位置は動きません。',
  });

  // App state: the first splitter (demo 1), the file list and its log (demo 2), the messages (demo 3).
  // アプリの状態です。最初のスプリッター (実演 1)、ファイル一覧とそのログ (実演 2)、メッセージ (実演 3) で使います。
  const state = {
    sideCollapsed: false,
    sideSize: 180,
    file: 'main.js',
    log: ['main.js'],
    messages: [
      { text: 'Welcome!' },
      { text: 'Sending a message jumps to the newest one.' },
      { text: 'Scroll away to read older ones: new messages then leave the view where it is.' },
    ],
    draft: '',
    incoming: false,
    count: 0,
  };

  // Components that keep state are registered with app.use(). They are assigned in `setup` at the
  // bottom, which runs once before the first render, so render needs no "is it ready yet" check.
  // 状態を持つ部品は app.use() で登録します。登録は下の `setup` で行います。
  // setup は最初の描画の前に 1 回だけ実行されるので、render 側で「準備できたか」を確かめる必要はありません。
  let split, outerSplit, innerSplit, logPane, chatPane, newestPane;

  // One demo on this page: a heading, a sentence that says what to try, then the live components.
  // このページの実演 1 つ分です: 見出し、試すことを書いた 1 文、その下に実際に動く部品を並べます。
  const demo = (title, text, ...children) => ({
    tag: 'section',
    class: 'demo',
    children: [{ tag: 'h2', children: [title] }, { tag: 'p', children: [text] }, ...children],
  });

  // Demo 1. The splitter fills its parent, so give the parent a height. `side` and `main` are the
  // contents of the two panels. Passing `collapsed` and `onCollapseChange` keeps "is the side panel
  // folded away" in your own state, so a button elsewhere on the page can fold it too.
  // split.setSize(px) sets the size from code. The size limits and onResizeEnd are options of
  // createSplitter: see `setup` at the bottom.
  // 実演 1。スプリッターは親要素いっぱいに広がるので、親に高さを指定します。`side` と `main` が 2 つのパネルの中身です。
  // `collapsed` と `onCollapseChange` を渡すと、「サイドパネルを折りたたんでいるか」を自分の state で持てるので、
  // ページの別の場所にあるボタンからも折りたためます。split.setSize(px) は、コードから大きさを設定します。
  // 大きさの上限・下限と onResizeEnd は createSplitter のオプションです (いちばん下の `setup` を見てください)。
  const splitterDemo = (s) =>
    demo(
      'createSplitter',
      t(
        'Drag the divider, or move to it with Tab and press ← or →. The side panel stays between 100px and 320px. The small button on the divider (it appears when the pointer is over the splitter) folds the side panel away.',
        { ja: '仕切り線をドラッグするか、Tab キーで仕切り線に移動して ← → を押してください。サイドパネルの幅は 100px〜320px の範囲に収まります。仕切り線の上の小さなボタン (ポインターをスプリッターに乗せると現れます) で、サイドパネルを折りたためます。' },
      ),
      {
        tag: 'div',
        class: 'frame',
        style: { height: '160px' },
        children: [
          split({
            collapsed: s.sideCollapsed,
            onCollapseChange: (v) => { s.sideCollapsed = v; },
            side: [{ tag: 'div', class: 'pad', children: [t('Side panel', { ja: 'サイドパネル' })] }],
            main: [{ tag: 'div', class: 'pad', children: [t('Main panel: it takes all the space that is left.', { ja: 'メインパネル: 残りの領域をすべて使います。' })] }],
          }),
        ],
      },
      U.uiRow({
        class: 'wrap',
        children: [
          U.uiButton({
            children: [s.sideCollapsed ? t('Show the side panel', { ja: 'サイドパネルを表示' }) : t('Hide the side panel', { ja: 'サイドパネルを隠す' })],
            onclick: () => { s.sideCollapsed = !s.sideCollapsed; },
          }),
          U.uiButton({
            children: [t('Back to 180px', { ja: '180px に戻す' })],
            onclick: () => {
              split.setSize(180);
              s.sideSize = 180;
            },
          }),
          U.uiText({ variant: 'muted', children: [t`Side panel: ${s.sideSize}px (min 100, max 320)`] }),
        ],
      }),
    );

  // Demo 2. A splitter can sit inside another one. The outer one puts the file list on the left;
  // the inner one (side: 'bottom') puts a log under the "editor". The log is a createScrollPane
  // that fills its panel (height: 100%) and follows its end as lines are added.
  // 実演 2。スプリッターは入れ子にできます。外側のスプリッターはファイル一覧を左に置き、
  // 内側のスプリッター (side: 'bottom') は「エディタ」の下にログを置きます。ログは createScrollPane で、
  // パネルいっぱいに広げ (height: 100%)、行が増えるたびに末尾へ追従します。
  const FILES = ['main.js', 'app.css', 'index.html', 'README.md'];
  const layoutDemo = (s) =>
    demo(
      t('An app layout: a splitter inside a splitter', { ja: 'アプリらしい配置: スプリッターの入れ子' }),
      t(
        'Three panels, two dividers: one moves sideways, the other up and down (↑ ↓ on the keyboard). Click a file name to add a line to the log at the bottom.',
        { ja: '3 つのパネルと 2 本の仕切り線です。1 本は左右に、もう 1 本は上下に動きます (キーボードでは ↑ ↓)。ファイル名をクリックすると、下のログに 1 行増えます。' },
      ),
      {
        tag: 'div',
        class: 'frame',
        style: { height: '260px' },
        children: [
          outerSplit({
            side: [
              U.uiCol({
                class: 'pad',
                gap: 2,
                children: FILES.map((f) =>
                  U.uiButton({
                    variant: f === s.file ? 'primary' : 'ghost',
                    size: 'sm',
                    children: [f],
                    onclick: () => {
                      s.file = f;
                      s.log = [...s.log, f];
                    },
                  }),
                ),
              }),
            ],
            main: [
              innerSplit({
                main: [{ tag: 'div', class: 'pad', children: [t`Contents of ${s.file}`] }],
                side: [
                  logPane({
                    class: 'pad',
                    style: { boxSizing: 'border-box', height: '100%' },
                    children: s.log.map((f) => ({ tag: 'div', children: [t`Opened ${f}`] })),
                  }),
                ],
              }),
            ],
          }),
        ],
      },
    );

  // Demo 3. createScrollPane({ follow }) is a scrolling box that goes back to its newest edge each time
  // the page is drawn, but only if the view was already at that edge (within 50px unless you
  // pass `threshold`); once the reader has scrolled away, it leaves the view alone.
  // pane.scrollToBottom() and pane.scrollToTop() jump there regardless.
  // The two panes below show the same messages: oldest first with follow: 'bottom', and newest
  // first with follow: 'top'.
  // 実演 3。createScrollPane({ follow }) は、画面が描き直されるたびに新しい側の端へ移動するスクロール領域です。
  // ただし移動するのは、表示位置がすでにその端にあったとき (`threshold` を渡さなければ 50px 以内) だけです。
  // 読み手がスクロールして端を離れている間は、表示位置を動かしません。
  // pane.scrollToBottom() と pane.scrollToTop() は、どこを見ていてもそこへ移動します。
  // 下の 2 つのペインは同じメッセージを表示しています。古い順は follow: 'bottom'、新しい順は follow: 'top' です。
  const messageLine = (m) => ({ tag: 'div', children: [m.n ? t`Incoming message ${m.n}` : t(m.text)] });
  const scrollPaneDemo = (s) =>
    demo(
      'createScrollPane',
      t(
        'Start the incoming messages: both panes keep the newest one in view. Now scroll one pane away from its newest end: it stops following until you scroll back, or press the button that jumps there.',
        { ja: '「メッセージの受信」を始めると、どちらのペインも最新のメッセージを表示し続けます。次に、片方のペインをスクロールして最新の端から離してください。端まで戻すか、端へ移動するボタンを押すまで、追従が止まります。' },
      ),
      U.uiGrid({
        class: 'wide',
        columns: 'auto-fit 240px',
        gap: 8,
        children: [
          U.uiCol({
            gap: 4,
            children: [
              U.uiText({ variant: 'label', children: ["follow: 'bottom'"] }),
              chatPane({ class: 'frame pad', style: { height: '130px' }, children: s.messages.map(messageLine) }),
            ],
          }),
          U.uiCol({
            gap: 4,
            children: [
              U.uiText({ variant: 'label', children: ["follow: 'top'"] }),
              newestPane({ class: 'frame pad', style: { height: '130px' }, children: [...s.messages].reverse().map(messageLine) }),
            ],
          }),
        ],
      }),
      U.uiRow({
        class: 'wrap',
        children: [
          U.bindInput(s, 'draft', { 'aria-label': t('Message', { ja: 'メッセージ' }), placeholder: t('Message', { ja: 'メッセージ' }), style: { width: '160px' } }),
          U.uiButton({
            variant: 'primary',
            children: [t('Send', { ja: '送信' })],
            onclick: () => {
              if (!s.draft) return;
              s.messages = [...s.messages, { text: s.draft }];
              s.draft = '';
              chatPane.scrollToBottom();
              newestPane.scrollToTop();
            },
          }),
          U.uiButton({
            children: [s.incoming ? t('Stop the incoming messages', { ja: 'メッセージの受信を止める' }) : t('Start the incoming messages', { ja: 'メッセージの受信を始める' })],
            onclick: () => { s.incoming = !s.incoming; },
          }),
          U.uiButton({ variant: 'ghost', children: [t('To the end', { ja: '末尾へ' })], onclick: () => chatPane.scrollToBottom() }),
          U.uiButton({ variant: 'ghost', children: [t('To the top', { ja: '先頭へ' })], onclick: () => newestPane.scrollToTop() }),
        ],
      }),
    );

  const app = ricdom.createApp(
    '#app',
    state,
    (s) =>
      U.uiPanel({
        class: 'page',
        children: [
          { tag: 'h1', children: [t('ricdom — splitter and scroll pane', { ja: 'ricdom — スプリッターとスクロールペイン' })] },
          splitterDemo(s),
          U.uiSeparator(),
          layoutDemo(s),
          U.uiSeparator(),
          scrollPaneDemo(s),
        ],
      }),
    {
      setup: (a) => {
        // side: which edge the side panel sits on ('left', 'right', 'top' or 'bottom'). size, min and
        // max are in px. onResizeEnd gets the final size once when a drag ends, and once per arrow
        // key press: the place to save the size. Here it only copies the size into the state.
        // side: サイドパネルを置く辺です ('left'・'right'・'top'・'bottom')。size・min・max の単位は px です。
        // onResizeEnd は、ドラッグが終わったときに 1 回、矢印キーでは押すたびに 1 回、確定した大きさを受け取ります。
        // 大きさを保存するならここです。この例では state に写すだけにしています。
        split = a.use(U.createSplitter({ side: 'left', size: 180, min: 100, max: 320, onResizeEnd: (size) => { a.sideSize = size; } }));
        outerSplit = a.use(U.createSplitter({ side: 'left', size: 130, min: 90, max: 220 }));
        innerSplit = a.use(U.createSplitter({ side: 'bottom', size: 90, min: 50, max: 150 }));
        logPane = a.use(U.createScrollPane({ follow: 'bottom' }));
        chatPane = a.use(U.createScrollPane({ follow: 'bottom' }));
        newestPane = a.use(U.createScrollPane({ follow: 'top' }));
      },
    },
  );

  // For demo 3: while s.incoming is true, a message arrives every second. Arrays in the state are
  // replaced with a new array instead of being pushed to; the assignment is what redraws the page.
  // 実演 3 のために、s.incoming が true の間、1 秒ごとにメッセージを 1 件追加します。state の中の配列は、
  // push せずに新しい配列で置き換えます。この代入をきっかけに、画面が描き直されます。
  setInterval(() => {
    if (!app.incoming) return;
    app.count += 1;
    app.messages = [...app.messages, { n: app.count }];
  }, 1000);

  // Site helper: t() returns a plain string, so draw again once when the language changes.
  // サイトの補助: t() の戻り値はただの文字列なので、言語が変わったら 1 回描き直します。
  onLangChange(() => app.renderNow());
</script>
</body>
</html>
