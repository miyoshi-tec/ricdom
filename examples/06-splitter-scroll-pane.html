<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ricdom — 06 Splitter, scroll pane and more (no build step)</title>
<!-- ricdom-ui.css styles ricdom's UI components (load it before your own CSS). _fonts.css only sets this site's fonts.
     ricdom-ui.css は ricdom の UI 部品の見た目です (自分の CSS より先に読み込みます)。_fonts.css はこのサイトのフォント設定だけです。 -->
<link rel="stylesheet" href="../dist/ricdom-ui.css">
<link rel="stylesheet" href="_fonts.css">
<style>
  h1 { font-size: 1.1rem; }
  h2 { font-size: 0.95rem; margin: 1.5rem 0 4px; }
  .app-shell { max-width: 900px; margin: 0 auto; }
</style>
</head>
<body>
<!--
  06 Splitter, scroll pane and more: components for building the screen layout of an app.
  splitter, scrollPane, collapseBox, accordion, tabs and dropdown keep state and are registered
  with app.use(); inlineMenu is a plain function.
  No build step: two scripts (ricdom, then ricdom/ui) and one stylesheet.

  06 スプリッター・スクロールペインほか: アプリの画面の骨組みを作る部品です。
  splitter・scrollPane・collapseBox・accordion・tabs・dropdown は状態を持つので app.use() で登録し、
  inlineMenu はただの関数として使います。
  ビルド不要: <script> 2 本 (ricdom → ricdom/ui) と CSS 1 本で動きます。
-->
<div id="app"></div>

<!-- Optional: highlight.js colours the code in this site's Source view. ricdom does not need it.
     任意: highlight.js はこのサイトの「ソース」表示を色分けします。ricdom 自体には不要です。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<!-- ricdom itself: the core first, then the UI components. They define the globals ricdom and ricdomUI.
     ricdom 本体: コア → UI 部品の順に読み込みます。グローバル変数 ricdom と ricdomUI ができます。 -->
<script src="../dist/ricdom.iife.min.js"></script>
<script src="../dist/ricdom-ui.iife.min.js"></script>
<!-- Docs-site helpers, not part of ricdom: the nav bar (theme, language, previous / next page) and t() for translations.
     このサイト専用の補助で、ricdom の一部ではありません: ナビバー (テーマ・言語・前後のページ) と翻訳用の t() です。 -->
<script src="_i18n.js"></script><script src="_samples.js"></script><script src="_nav.js"></script>
<script>
  // A short name for the UI components.
  // UI 部品を短い名前で呼べるようにします。
  const U = ricdomUI;

  // Site helper: t(text, { ja: '...' }) returns the text in the chosen language, with the Japanese
  // written where the string is used. The entries in addDict are strings chosen at run time
  // (t(row), t(m) below): there is no single place to write their Japanese, so they go in the dictionary.
  // サイトの補助: t(文字列, { ja: '…' }) は選択中の言語の文字列を返します。日本語は使う場所に書きます。
  // addDict の分は、実行時に決まる文字列 (下の t(row)・t(m)) です。日本語を書く場所が 1 か所に決まらないので、辞書に登録します。
  const { t, addDict, onLangChange } = ricdomI18n;
  addDict('ja', {
    'Row A': '行 A',
    'Row B': '行 B',
    // The first chat messages are kept as English text and translated when drawn, so a message
    // the user types (which has no entry here) is shown exactly as typed.
    // 最初のチャットメッセージは英語のまま持ち、描画するときに翻訳します。
    // ユーザーが入力したメッセージ (ここに訳が無い) は、入力したとおりに表示されます。
    'Welcome!': 'ようこそ！',
    'This is a createScrollPane demo.': 'これは createScrollPane のデモです。',
    'Sending a message scrolls to the end automatically.': 'メッセージを送ると自動で末尾までスクロールします。',
  });

  // Icon data (SVG paths) comes from `npx ricdom-icon settings`. Copy it; do not write it by hand.
  // アイコンのデータ (SVG のパス) は `npx ricdom-icon settings` で取得します。手書きはしません。
  const ICON_GEAR = { p: ['M12 2v2', 'M12 20v2', 'M4.93 4.93l1.41 1.41', 'M17.66 17.66l1.41 1.41', 'M2 12h2', 'M20 12h2', 'M4.93 19.07l1.41-1.41', 'M17.66 6.34l1.41-1.41', 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'] };

  // App state, in order: the splitter, the chat (scroll pane), the details box, the sort dropdown and the inline menu.
  // アプリの状態です。上から順に、スプリッター・チャット (スクロールペイン)・詳細の開閉・並び順のドロップダウン・行のメニューで使います。
  const state = {
    sidebarCollapsed: false,
    messages: ['Welcome!', 'This is a createScrollPane demo.', 'Sending a message scrolls to the end automatically.'],
    draft: '',
    detailsOpen: false,
    sort: 'name',
    menuForRow: null,
  };

  // Components that keep state are registered with app.use(). They are assigned in `setup` at the
  // bottom, which runs once before the first render, so render needs no "is it ready yet" check.
  // 状態を持つ部品は app.use() で登録します。登録は下の `setup` で行います。
  // setup は最初の描画の前に 1 回だけ実行されるので、render 側で「準備できたか」を確かめる必要はありません。
  let split, pane, box, acc, tabs, sortDD, actionsDD;

  // createSplitter: a side panel and a main area with a draggable divider. Passing `collapsed` and
  // `onCollapseChange` keeps the collapsed state in your own state.
  // createSplitter: サイドパネルとメイン領域を、ドラッグできる仕切り線で分けます。
  // `collapsed` と `onCollapseChange` を渡すと、折りたたみの状態を自分の state で持てます。
  const splitterDemo = (s) =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createSplitter'] },
        {
          tag: 'div',
          style: { height: '180px', border: '1px solid var(--ric-color-border)', borderRadius: 'var(--ric-radius)' },
          children: [
            split({
              collapsed: s.sidebarCollapsed,
              onCollapseChange: (v) => { s.sidebarCollapsed = v; },
              side: [{ tag: 'div', style: { padding: '8px' }, children: [U.uiText({ children: [t('Side panel', { ja: 'サイドパネル' })] })] }],
              main: [{ tag: 'div', style: { padding: '8px' }, children: [U.uiText({ children: [t(
                'Main panel (drag the divider, or focus it and use the arrow keys)',
                { ja: 'メインパネル (仕切り線をドラッグ、またはフォーカスして矢印キー)' },
              )] })] }],
            }),
          ],
        },
      ],
    });

  // createScrollPane with follow: 'bottom' stays at the end as content is added, like a chat log.
  // pane.scrollToBottom() jumps to the end from code.
  // createScrollPane に follow: 'bottom' を指定すると、内容が増えても末尾に追従します (チャットのログのように)。
  // pane.scrollToBottom() でコードから末尾へ移動できます。
  const scrollPaneDemo = (s) =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createScrollPane (follow: "bottom")'] },
        pane({
          style: { height: '140px', border: '1px solid var(--ric-color-border)', borderRadius: 'var(--ric-radius)', padding: '8px' },
          children: s.messages.map((m) => ({ tag: 'div', children: [t(m)] })),
        }),
        U.uiRow({
          children: [
            U.bindInput(s, 'draft', { placeholder: t('Message', { ja: 'メッセージ' }) }),
            U.uiButton({
              variant: 'primary',
              children: [t('Send', { ja: '送信' })],
              onclick: () => {
                if (!s.draft) return;
                s.messages = [...s.messages, s.draft];
                s.draft = '';
              },
            }),
            U.uiButton({ variant: 'ghost', children: [t('To the end', { ja: '末尾へ' })], onclick: () => pane.scrollToBottom() }),
          ],
        }),
      ],
    });

  // createCollapseBox animates showing and hiding its content. box.idFor() gives the id to put in
  // aria-controls on your own toggle button.
  // createCollapseBox は中身の表示・非表示をアニメーションで切り替えます。
  // box.idFor() は、自分で作った開閉ボタンの aria-controls に入れる id を返します。
  const collapseBoxDemo = (s) =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createCollapseBox'] },
        U.uiButton({
          id: 'details-toggle',
          'aria-expanded': String(s.detailsOpen),
          'aria-controls': box.idFor(),
          children: [s.detailsOpen ? t('Hide details', { ja: '詳細を隠す' }) : t('Show details', { ja: '詳細を表示' })],
          onclick: () => { s.detailsOpen = !s.detailsOpen; },
        }),
        box({ visible: s.detailsOpen, children: [U.uiPanel({ children: [t(
          'The details go here. Opening and closing is animated.',
          { ja: 'ここに詳細な説明文が入ります。開閉はアニメーションします。' },
        )] })] }),
      ],
    });

  // createAccordion: with multi: false, opening one item closes the others. defaultOpen (in setup)
  // opens q1 at the start.
  // createAccordion: multi: false にすると、1 つを開けば他は閉じます。setup の defaultOpen で最初に q1 を開いています。
  const accordionDemo = () =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createAccordion'] },
        acc({
          items: [
            {
              id: 'q1',
              title: t('Do I need a build?', { ja: 'ビルドは必要ですか？' }),
              children: [U.uiText({ children: [t('No. Two IIFE bundles and one CSS <link> are enough.', { ja: 'いいえ。IIFE 2 本と CSS の <link> 1 本だけで動きます。' })] })],
            },
            {
              id: 'q2',
              title: t('How do I register a stateful component?', { ja: '状態を持つ部品はどう登録しますか？' }),
              children: [U.uiText({ children: [t('Explicitly, with app.use(createX()).', { ja: 'app.use(createX()) で明示的に登録します。' })] })],
            },
          ],
          multi: false,
        }),
      ],
    });

  // createTabs remembers the selected tab by itself (uncontrolled), so no state is needed here.
  // createTabs は選択中のタブを自分で覚えるので (uncontrolled)、ここでは state を使いません。
  const tabsDemo = () =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createTabs (uncontrolled)'] },
        tabs({
          items: [
            {
              key: 'a',
              label: t('Profile', { ja: 'プロフィール' }),
              children: [U.uiText({ children: [t('Contents of the profile tab', { ja: 'プロフィールタブの中身' })] })],
            },
            {
              key: 'b',
              label: t('Notifications', { ja: '通知設定' }),
              children: [U.uiText({ children: [t('Contents of the notifications tab', { ja: '通知設定タブの中身' })] })],
            },
            {
              key: 'c',
              label: t('Billing', { ja: '請求' }),
              children: [U.uiText({ children: [t('Contents of the billing tab', { ja: '請求タブの中身' })] })],
            },
          ],
        }),
      ],
    });

  // createDropdown: a button that opens a menu, shown as a text label or as an icon. Call close()
  // after a choice is made.
  // createDropdown: メニューを開くボタンで、文字のラベルでもアイコンでも表示できます。項目を選んだら close() を呼びます。
  const dropdownDemo = (s) =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createDropdown (label / icon modes)'] },
        U.uiRow({
          children: [
            sortDD({
              label: t('Sort: ', { ja: '並び順: ' }) + s.sort,
              chevron: true,
              children: ['name', 'date', 'size'].map((v) =>
                U.uiButton({ variant: v === s.sort ? 'primary' : 'ghost', children: [v], onclick: () => { s.sort = v; sortDD.close(); } }),
              ),
            }),
            actionsDD({
              icon: U.uiIcon(ICON_GEAR, { size: 16 }),
              ghost: true,
              children: [
                U.uiButton({ variant: 'ghost', children: [t('Export', { ja: 'エクスポート' })], onclick: () => actionsDD.close() }),
                U.uiButton({ variant: 'ghost', children: [t('Import', { ja: 'インポート' })], onclick: () => actionsDD.close() }),
              ],
            }),
          ],
        }),
      ],
    });

  // uiInlineMenu is a plain function: the menu is drawn inside the row itself (the row's
  // position: relative anchors it). Which row's menu is open lives in state.menuForRow.
  // uiInlineMenu はただの関数で、メニューは行そのものの中に描かれます (行の position: relative が基準)。
  // どの行のメニューが開いているかは state.menuForRow で持ちます。
  const inlineMenuDemo = (s) =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['uiInlineMenu (pure function, no portal)'] },
        U.uiCol({
          children: ['Row A', 'Row B'].map((row) => ({
            tag: 'div',
            style: { position: 'relative', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 8px', border: '1px solid var(--ric-color-border)', borderRadius: 'var(--ric-radius)' },
            children: [
              t(row),
              U.uiButton({
                variant: 'ghost',
                children: ['⋯'],
                onclick: (e) => {
                  // Keep this click from reaching the document listener below, which would close the menu again.
                  // このクリックが下の document のリスナーに届くと、開いたメニューがすぐ閉じてしまうので止めます。
                  e.stopPropagation();
                  s.menuForRow = s.menuForRow === row ? null : row;
                },
              }),
              U.uiInlineMenu({
                open: s.menuForRow === row,
                anchor: 'br',
                onClose: () => { s.menuForRow = null; },
                children: [
                  U.uiButton({ children: [t('Rename', { ja: '名前を変更' })], onclick: () => { s.menuForRow = null; } }),
                  U.uiButton({ children: [t('Delete', { ja: '削除' })], onclick: () => { s.menuForRow = null; } }),
                ],
              }),
            ],
          })),
        }),
      ],
    });

  const app = ricdom.createApp(
    '#app',
    state,
    (s) =>
      U.uiPanel({
        class: 'app-shell',
        style: { margin: '2rem auto' },
        children: [
          { tag: 'h1', children: [t('ricdom — splitter, scroll pane and more', { ja: 'ricdom — スプリッター・スクロールペインほか' })] },
          splitterDemo(s),
          U.uiSeparator(),
          scrollPaneDemo(s),
          U.uiSeparator(),
          collapseBoxDemo(s),
          U.uiSeparator(),
          accordionDemo(),
          U.uiSeparator(),
          tabsDemo(),
          U.uiSeparator(),
          dropdownDemo(s),
          U.uiSeparator(),
          inlineMenuDemo(s),
        ],
      }),
    {
      setup: (a) => {
        split = a.use(U.createSplitter({ side: 'left', size: 180, min: 100, max: 320 }));
        pane = a.use(U.createScrollPane({ follow: 'bottom' }));
        box = a.use(U.createCollapseBox());
        acc = a.use(U.createAccordion({ defaultOpen: { q1: true } }));
        tabs = a.use(U.createTabs());
        sortDD = a.use(U.createDropdown());
        actionsDD = a.use(U.createDropdown());
      },
    },
  );

  // Close the inline menu on a click anywhere else. The library keeps no global listener for this,
  // so the app writes this one. Write through `app` (the reactive handle), not the original `state`.
  // どこか別の場所をクリックしたら行のメニューを閉じます。ライブラリはこのための全体リスナーを持たないので、アプリ側で 1 つ書きます。
  // 書き込みは元の `state` ではなく、リアクティブな `app` を通して行います。
  document.addEventListener('click', () => {
    if (app.menuForRow !== null) app.menuForRow = null;
  });

  // Site helper: t() returns a plain string, so draw again once when the language changes.
  // サイトの補助: t() の戻り値はただの文字列なので、言語が変わったら 1 回描き直します。
  onLangChange(() => app.renderNow());
</script>
</body>
</html>
