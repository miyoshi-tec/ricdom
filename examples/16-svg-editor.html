<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ricdom — 16 SVG editor (no build step)</title>
<!-- ricdom-ui.css styles ricdom's UI components (load it before your own CSS). _fonts.css only sets this site's fonts.
     ricdom-ui.css は ricdom の UI 部品の見た目です (自分の CSS より先に読み込みます)。_fonts.css はこのサイトのフォント設定だけです。 -->
<link rel="stylesheet" href="../dist/ricdom-ui.css">
<link rel="stylesheet" href="_fonts.css">
<style>
  /* The page's own layout. None of these rules is needed by ricdom.
     このページ自身のレイアウトです。ricdom に必要な規則はありません。 */
  .page { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
  .page > h1 { font-size: 1.2rem; margin: 0 0 4px; }
  .editor { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 12px; }
  /* On a narrow screen the two parts are stacked, the drawing first, so that it stays in view while the list below grows.
     狭い画面では 2 つを縦に並べ、絵を先に置きます。下の一覧が長くなっても、絵が見えたままになります。 */
  @media (max-width: 720px) { .editor { grid-template-columns: minmax(0, 1fr); } .editor > .stage { order: -1; } }
  .stage { display: flex; flex-direction: column; gap: 8px; }

  /* The drawing. It is white in every theme, like a sheet of paper. touch-action: none lets a finger drag a shape instead of scrolling the page.
     user-select: none keeps a drag from selecting the text in the drawing, as it would select text anywhere else on a page.
     絵を描く面です。紙のように、どのテーマでも白にしています。touch-action: none は、指で図形をドラッグしたときにページがスクロールしないようにする指定です。
     user-select: none は、ドラッグで絵の中の文字が選択されないようにする指定です。指定しないと、ページのほかの文字と同じように選択されます。 */
  .canvas { display: block; width: 100%; height: auto; background: #fff; border: 1px solid var(--ric-color-border); border-radius: var(--ric-radius); touch-action: none; -webkit-user-select: none; user-select: none; }
  .shape { cursor: move; }
  /* The frame around the selected shape, and the four handles on its corners. The frame lets presses through to the shapes under it.
     vector-effect keeps the lines the same thickness on the screen, whatever size the drawing is shown at.
     選択中の図形を囲む枠と、その四隅のつまみです。枠は、押した操作を下の図形へ通します。
     vector-effect は、絵がどんな大きさで表示されていても、線を画面上で同じ太さに保ちます。 */
  .frame { fill: none; stroke: #f59e0b; stroke-width: 1.5px; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; pointer-events: none; }
  .handle { fill: #fff; stroke: #f59e0b; stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
  .handle.nwse { cursor: nwse-resize; }
  .handle.nesw { cursor: nesw-resize; }
  /* For a finger, a wide see-through border makes each handle a larger target.
     指で操作する画面では、透けた太い縁取りで、つまみを押しやすい大きさにします。 */
  @media (pointer: coarse) { .handle { stroke-width: 14px; stroke-opacity: 0.3; paint-order: stroke; } }
  .grid-line { fill: none; stroke: #e5e7eb; }
  /* A spare, invisible <svg>: a text is drawn in it to find out how large it is.
     予備の、見えない <svg> です。文字の大きさを調べるために、ここに文字を描きます。 */
  #ruler { position: absolute; width: 0; height: 0; visibility: hidden; }

  /* The list of shapes: each row shows the markup of one shape.
     図形の一覧です。1 行が、図形 1 つぶんのマークアップです。 */
  .rows { display: flex; flex-direction: column; gap: 2px; }
  .row { box-sizing: border-box; width: 100%; padding: 3px 8px; border: 0; border-radius: 4px; background: none; color: inherit; cursor: pointer; text-align: left; font-family: Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row:hover { background: color-mix(in srgb, var(--ric-color-accent) 14%, transparent); }
  .row.is-selected { background: var(--ric-color-accent); color: var(--ric-color-accent-fg); }
  .field { display: grid; grid-template-columns: 6em minmax(0, 1fr); align-items: center; gap: 8px; }
  .wrap { flex-wrap: wrap; }
</style>
</head>
<body>
<!--
  16 SVG editor: the objects in the state are the SVG.
  Each shape is a plain object such as { tag: 'circle', cx: 80, cy: 100, r: 40, fill: '#3b82f6' }.
  ricdom draws those objects as they are, so editing the drawing means replacing an object:
  dragging replaces its position, a field in the panel replaces one attribute.
  And because a change never edits the old objects, keeping them is all that undo needs.
  No build step: two scripts (ricdom, then ricdom/ui) and one stylesheet.

  16 SVG エディタ: 状態の中のオブジェクトが、そのまま SVG になります。
  図形 1 つは { tag: 'circle', cx: 80, cy: 100, r: 40, fill: '#3b82f6' } のような普通のオブジェクトです。
  ricdom はそのオブジェクトをそのまま描くので、絵を編集することは、オブジェクトを差し替えることです。
  ドラッグは位置を差し替え、パネルの欄は属性を 1 つ差し替えます。
  変更は古いオブジェクトを書き換えないので、それを取っておくだけで「元に戻す」ができます。
  ビルド不要: <script> 2 本 (ricdom → ricdom/ui) と CSS 1 本で動きます。
-->
<div id="app"></div>
<svg id="ruler" aria-hidden="true"><text></text></svg>

<!-- Optional: highlight.js colours the code in this site's Source view. ricdom does not need it.
     任意: highlight.js はこのサイトの「ソース」表示を色分けします。ricdom 自体には不要です。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<!-- ricdom itself: the core first, then the UI components. They define the globals ricdom and ricdomUI.
     ricdom 本体: コア → UI 部品の順に読み込みます。グローバル変数 ricdom と ricdomUI ができます。 -->
<script src="../dist/ricdom.iife.min.js"></script>
<script src="../dist/ricdom-ui.iife.min.js"></script>
<!-- Docs-site helpers, not part of ricdom: the nav bar (theme, language, previous / next page) and t() for translations.
     このサイト専用の補助で、ricdom の一部ではありません: ナビバー (テーマ・言語・前後のページ) と翻訳用の t() です。 -->
<script src="_i18n.js"></script><script src="_samples.js"></script><script src="_nav.js"></script>
<script>
  // A short name for the UI components.
  // UI 部品を短い名前で呼べるようにします。
  const U = ricdomUI;

  // Site helper: t(text, { ja: '...' }) returns the text in the chosen language.
  // サイトの補助: t(文字列, { ja: '…' }) は選択中の言語の文字列を返します。
  const { t, onLangChange } = ricdomI18n;

  // Icon data (SVG paths) comes from `npx ricdom-icon plus trash-2 undo-2 redo-2`. Copy it; do not write it by hand.
  // アイコンのデータ (SVG のパス) は `npx ricdom-icon plus trash-2 undo-2 redo-2` で取得します。手書きはしません。
  const ICONS = {
    plus: { p: 'M12 5v14M5 12h14' },
    'trash-2': { p: 'M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6' },
    'undo-2': { p: ['M9 14 4 9l5-5', 'M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11'] },
    'redo-2': { p: ['m15 14 5-5-5-5', 'M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13'] },
  };

  // ── The data ─────────────────────────────────────────────────────────────────────────────────
  // A shape is the object that ricdom draws: `tag` and the SVG attributes, as they are.
  // `key` tells ricdom which element belongs to which shape, so an element stays with its shape
  // when shapes are added or removed (and while one is being dragged).
  // 図形は、ricdom が描くオブジェクトそのものです。`tag` と SVG の属性を、そのまま書きます。
  // `key` は「どの要素がどの図形のものか」を ricdom に伝えます。図形を足したり消したりしても
  // (ドラッグの途中でも)、要素は自分の図形に付いたままになります。
  const state = {
    shapes: [
      { key: 1, tag: 'circle', cx: 80, cy: 110, r: 40, fill: '#3b82f6' },
      { key: 2, tag: 'rect', x: 160, y: 60, width: 100, height: 100, rx: 8, fill: '#10b981' },
      { key: 3, tag: 'text', x: 110, y: 40, 'font-size': 18, fill: '#111827', children: ['Hello SVG'] },
    ],
    selected: 1,
    // Whether a drag snaps to the grid.
    // ドラッグをグリッドに吸着させるかどうかです。
    grid: false,
    // Earlier and later versions of `shapes`, for undo and redo.
    // 「元に戻す」と「やり直す」のための、前と後の `shapes` です。
    undo: [],
    redo: [],
  };
  let nextKey = 4;

  // The spacing of the grid, the number of steps that undo remembers, and the size of a handle.
  // グリッドの間隔、「元に戻す」が覚えておく段数、つまみの大きさです。
  const GRID = 10;
  const HISTORY = 20;
  const HANDLE = 8;

  // What a new shape looks like.
  // 新しく足す図形の初期値です。
  const NEW_SHAPE = {
    circle: () => ({ tag: 'circle', cx: 150, cy: 100, r: 30, fill: '#f59e0b' }),
    rect: () => ({ tag: 'rect', x: 110, y: 70, width: 80, height: 60, rx: 0, fill: '#8b5cf6' }),
    text: () => ({ tag: 'text', x: 130, y: 180, 'font-size': 16, fill: '#111827', children: ['Text'] }),
  };

  // The attributes that hold the position of each kind of shape: the centre of a circle, the
  // top left corner of a rect, and for a text the left end of the line its letters stand on.
  // 図形の種類ごとの、位置を表す属性です。circle は中心、rect は左上の角、text は
  // 「文字が乗る線」の左端です。
  const POSITION = { circle: ['cx', 'cy'], rect: ['x', 'y'], text: ['x', 'y'] };

  // ── Undo and redo ────────────────────────────────────────────────────────────────────────────
  // No change edits an array in place; every change assigns a new one. The array that was there
  // before is therefore still intact, and keeping it is all that undo needs.
  // remember() is called just before a change. `step` says what is being done: changes that come
  // one after another with the same `step` (every move of one drag, every keystroke in one field)
  // are undone together.
  // どの変更も、配列をその場で書き換えず、新しい配列を代入します。だから前の配列は無傷で残っていて、
  // それを取っておくだけで「元に戻す」ができます。
  // remember() は変更の直前に呼びます。`step` は「何をしているか」です。同じ `step` の変更が続く間
  // (1 回のドラッグの動き全部、1 つの欄への入力全部) は、まとめて 1 回で戻ります。
  let lastStep = null;
  const remember = (s, step) => {
    if (step && step === lastStep) return;
    lastStep = step;
    s.undo = [...s.undo, s.shapes].slice(-HISTORY);
    s.redo = [];
  };
  // Undo is restore(s, 'undo', 'redo'): take the newest array out of `undo`, and put the current
  // one into `redo`. Redo is the same with the two names swapped.
  // 「元に戻す」は restore(s, 'undo', 'redo') です。`undo` からいちばん新しい配列を取り出し、
  // いまの配列を `redo` に入れます。「やり直す」は、2 つの名前を入れ替えるだけです。
  const restore = (s, from, to) => {
    if (s[from].length === 0) return;
    s[to] = [...s[to], s.shapes];
    s.shapes = s[from].at(-1);
    s[from] = s[from].slice(0, -1);
    lastStep = null;
  };

  // Every change to a shape goes through here: build a new array in which one shape is a new
  // object, and assign it. Assigning to s.shapes is what makes ricdom draw again.
  // 図形の変更は、すべてここを通ります。図形 1 つだけを新しいオブジェクトにした新しい配列を作り、
  // 代入します。s.shapes への代入が、ricdom に描き直させます。
  const change = (s, key, patch, step) => {
    const before = s.shapes.find((shape) => shape.key === key);
    // When no value differs (a press that did not move, for example), there is nothing to draw
    // and nothing to undo.
    // 値が 1 つも変わらないとき (押しただけで動かしていないときなど) は、描き直すものも、
    // 元に戻すものもありません。
    if (Object.keys(patch).every((name) => patch[name] === before[name])) return;
    remember(s, step);
    s.shapes = s.shapes.map((shape) => (shape.key === key ? { ...shape, ...patch } : shape));
  };

  // ── The box around a shape ───────────────────────────────────────────────────────────────────
  // BOX gives the rectangle that encloses a shape; the frame is drawn there. A circle and a rect
  // say it in their attributes. A text does not, so it is measured: the same text is put into
  // the invisible <svg id="ruler"> and the browser is asked for its box.
  // BOX は、図形を囲む長方形を返します。枠はそこに描きます。circle と rect は、属性から分かります。
  // text は分からないので、測ります。同じ文字を見えない <svg id="ruler"> に入れて、
  // ブラウザに箱の大きさを尋ねます。
  const ruler = document.querySelector('#ruler text');
  const BOX = {
    circle: (shape) => ({ x: shape.cx - shape.r, y: shape.cy - shape.r, width: shape.r * 2, height: shape.r * 2 }),
    rect: (shape) => ({ x: shape.x, y: shape.y, width: shape.width, height: shape.height }),
    text: (shape) => {
      for (const name of ['x', 'y', 'font-size']) ruler.setAttribute(name, shape[name]);
      // An empty text has no box. Measure a stand-in, so that there is still a frame to take hold of.
      // 空の文字には箱がありません。つかめる枠が残るように、代わりの 1 文字を測ります。
      ruler.textContent = shape.children[0] || '?';
      return ruler.getBBox();
    },
  };

  // The two modes of a drag. Every value that a drag writes goes through snap(): with the grid
  // on it becomes a multiple of the grid spacing, with the grid off a whole number.
  // ドラッグの 2 つのモードです。ドラッグが書き込む値は、すべて snap() を通ります。グリッドが
  // 入のときはグリッドの間隔の倍数に、切のときは整数になります。
  const step = (s) => (s.grid ? GRID : 1);
  const snap = (s, value) => Math.round(value / step(s)) * step(s);

  // RESIZE gives the attributes to replace while a corner of the box is dragged. (x, y) is where
  // the dragged corner is now, and (fx, fy) is the opposite corner.
  //   rect:   the opposite corner stays, and the dragged corner goes to the grid.
  //   circle: the centre stays, and only the radius changes.
  //   text:   the opposite corner stays, and the height decides the font size.
  // RESIZE は、箱の角をドラッグしている間に差し替える属性を返します。(x, y) はつまんでいる角の
  // いまの位置、(fx, fy) は反対の角です。
  //   rect:   反対の角は動かず、つまんでいる角がグリッドに乗ります。
  //   circle: 中心は動かず、半径だけが変わります。
  //   text:   反対の角は動かず、高さから font-size が決まります。
  const RESIZE = {
    rect: (s, shape, box, fx, fy, x, y) => ({
      x: Math.min(fx, snap(s, x)),
      y: Math.min(fy, snap(s, y)),
      width: Math.max(step(s), Math.abs(snap(s, x) - fx)),
      height: Math.max(step(s), Math.abs(snap(s, y) - fy)),
    }),
    circle: (s, shape, box, fx, fy, x, y) => ({
      r: Math.max(step(s), snap(s, Math.max(Math.abs(x - shape.cx), Math.abs(y - shape.cy)))),
    }),
    text: (s, shape, box, fx, fy, x, y) => {
      // The height of the box follows the font size. `scale` is how many times larger the text
      // becomes; the box grows by the same amount, away from the opposite corner.
      // 箱の高さは文字の大きさに比例します。`scale` は文字が何倍になるかで、箱も同じだけ、
      // 反対の角から離れる向きに大きくなります。
      const size = Math.max(step(s), snap(s, (shape['font-size'] * Math.abs(y - fy)) / box.height));
      const scale = size / shape['font-size'];
      const left = x < fx ? fx - box.width * scale : fx;
      const top = y < fy ? fy - box.height * scale : fy;
      return {
        'font-size': size,
        x: snap(s, left + (shape.x - box.x) * scale),
        y: snap(s, top + (shape.y - box.y) * scale),
      };
    },
  };

  // ── Dragging ─────────────────────────────────────────────────────────────────────────────────
  // The drag in progress is kept outside the state: nothing on the screen shows it, so it does
  // not need to cause a redraw. `patch` is a function from the pointer position to the attributes
  // to replace. Moving a shape and resizing it differ only in that function.
  // ドラッグの途中経過は、状態の外に持ちます。画面には出ないので、描き直す必要が無いからです。
  // `patch` は、ポインターの位置から「差し替える属性」を作る関数です。図形の移動と変形の違いは、
  // この関数だけです。
  let drag = null;

  // Where the pointer is, in the coordinates of the drawing (the viewBox), whatever size the
  // drawing is shown at.
  // ポインターの位置を、絵の座標 (viewBox) に直します。絵がどんな大きさで表示されていても同じです。
  const toDrawing = (svg, e) => new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());

  const startDrag = (s, shape, e, patch) => {
    // From here on, pointer events go to the <svg> even when the pointer leaves it.
    // これ以降、ポインターが <svg> の外へ出ても、イベントは <svg> に届きます。
    e.currentTarget.ownerSVGElement.setPointerCapture(e.pointerId);
    s.selected = shape.key;
    drag = { key: shape.key, patch };
  };
  // The drag itself is the `step`, so one drag is undone in one go, however many moves it had.
  // ドラッグそのものを `step` にします。何回動いても、1 回のドラッグは 1 回で戻ります。
  const moveDrag = (s, e) => {
    if (drag) change(s, drag.key, drag.patch(toDrawing(e.currentTarget, e)), drag);
  };
  const endDrag = () => { drag = null; };

  // Moving: the position when the drag began, plus the distance the pointer has travelled since.
  // 移動: ドラッグを始めたときの位置に、ポインターが動いた距離を足します。
  const moving = (s, shape, e) => {
    const [xName, yName] = POSITION[shape.tag];
    const from = toDrawing(e.currentTarget.ownerSVGElement, e);
    return (now) => ({
      [xName]: snap(s, shape[xName] + now.x - from.x),
      [yName]: snap(s, shape[yName] + now.y - from.y),
    });
  };

  // Resizing: `corner` is [0 or 1, 0 or 1], which corner of the box is being dragged. That corner
  // moves like a shape does (where it was + the distance travelled), and RESIZE turns its
  // position into attributes.
  // 変形: `corner` は [0 か 1, 0 か 1] で、箱のどの角をつまんでいるかです。その角は、図形の移動と
  // 同じように動きます (始めの位置 + 動いた距離)。RESIZE が、その位置を属性に直します。
  const CORNERS = [[0, 0], [1, 0], [0, 1], [1, 1]];
  const resizing = (s, shape, corner, e) => {
    const box = BOX[shape.tag](shape);
    const from = toDrawing(e.currentTarget.ownerSVGElement, e);
    const x = box.x + corner[0] * box.width;
    const y = box.y + corner[1] * box.height;
    const fx = box.x + (1 - corner[0]) * box.width;
    const fy = box.y + (1 - corner[1]) * box.height;
    return (now) => RESIZE[shape.tag](s, shape, box, fx, fy, x + now.x - from.x, y + now.y - from.y);
  };

  // ── Drawing ──────────────────────────────────────────────────────────────────────────────────
  // The frame of the selected shape: a dashed rectangle on its box, and a handle on each corner.
  // 選択中の図形の枠です。箱に沿った破線の長方形と、四隅のつまみです。
  const frame = (s, shape) => {
    const box = BOX[shape.tag](shape);
    return {
      tag: 'g',
      key: 'frame',
      children: [
        { tag: 'rect', class: 'frame', x: box.x, y: box.y, width: box.width, height: box.height },
        ...CORNERS.map((corner) => ({
          tag: 'rect',
          class: corner[0] === corner[1] ? 'handle nwse' : 'handle nesw',
          x: box.x + corner[0] * box.width - HANDLE / 2,
          y: box.y + corner[1] * box.height - HANDLE / 2,
          width: HANDLE,
          height: HANDLE,
          onpointerdown: (e) => startDrag(s, shape, e, resizing(s, shape, corner, e)),
        })),
      ],
    };
  };

  // The lines of the grid: a pattern of one grid cell, and a rectangle filled with it.
  // The rectangle lets presses through, so a press on it still counts as a press on the empty part.
  // グリッドの線です。グリッド 1 ますぶんのパターンと、それで塗った長方形です。
  // この長方形は押した操作を通すので、ここを押しても「何も無いところを押した」ことになります。
  const gridLines = [
    {
      tag: 'pattern',
      key: 'pattern',
      id: 'grid',
      width: GRID,
      height: GRID,
      patternUnits: 'userSpaceOnUse',
      children: [{ tag: 'path', class: 'grid-line', d: `M${GRID} 0H0V${GRID}` }],
    },
    { tag: 'rect', key: 'grid', width: '100%', height: '100%', fill: 'url(#grid)', 'pointer-events': 'none' },
  ];

  // The picture: the shapes from the state, each with a class and a handler added. Nothing else
  // is converted, which is the point of this page. Later children are drawn over earlier ones,
  // so the frame goes last: it is in front of every shape.
  // 絵の部分です。状態の図形に、class とハンドラを足しただけです。ほかには何も変換しません。
  // それがこのページで見せたいことです。後ろの子ほど手前に描かれるので、枠は最後に置きます。
  // どの図形よりも手前になります。
  const drawing = (s, selected) => ({
    tag: 'svg',
    class: 'canvas',
    viewBox: '0 0 300 200',
    role: 'img',
    'aria-label': t('The drawing', { ja: '描いている絵' }),
    // A press on the empty part of the drawing clears the selection.
    // 絵の何も無いところを押すと、選択を外します。
    onpointerdown: (e) => { if (e.target === e.currentTarget) s.selected = null; },
    onpointermove: (e) => moveDrag(s, e),
    onpointerup: endDrag,
    onpointercancel: endDrag,
    children: [
      ...(s.grid ? gridLines : []),
      ...s.shapes.map((shape) => ({
        ...shape,
        class: 'shape',
        onpointerdown: (e) => startDrag(s, shape, e, moving(s, shape, e)),
      })),
      selected ? frame(s, selected) : null,
    ],
  });

  // One shape as markup, for the list.
  // 図形 1 つをマークアップの文字にします。一覧に使います。
  const markup = (shape) => {
    const attrs = Object.entries(shape)
      .filter(([name]) => name !== 'key' && name !== 'tag' && name !== 'children')
      .map(([name, value]) => ` ${name}="${value}"`)
      .join('');
    return shape.children ? `<${shape.tag}${attrs}>${shape.children[0]}</${shape.tag}>` : `<${shape.tag}${attrs} />`;
  };

  // The fields for the selected shape: one per attribute, made from the object itself.
  // A number gets a number field, `fill` a colour picker, and a text shape one more field for
  // its text. Each field replaces one attribute through change(). The shape and the attribute
  // together are the `step`, so what is typed into one field is undone in one go.
  // 選択中の図形の欄です。オブジェクトそのものから、属性 1 つにつき 1 つ作ります。
  // 数値は数値の欄、`fill` は色の選択、text の図形には文字の欄を 1 つ足します。
  // どの欄も、change() で属性を 1 つ差し替えます。図形と属性の組を `step` にするので、
  // 1 つの欄に打った分は 1 回で戻ります。
  const fields = (s, shape) => [
    ...Object.entries(shape)
      .filter(([name, value]) => name === 'fill' || typeof value === 'number')
      .filter(([name]) => name !== 'key')
      .map(([name, value]) => ({
        tag: 'label',
        class: 'field',
        children: [
          U.uiText({ variant: 'muted', children: [name] }),
          name === 'fill'
            ? U.uiColor({ value, oninput: (e) => change(s, shape.key, { fill: e.target.value }, `${shape.key} fill`) })
            : U.uiInput({
                type: 'number',
                value: String(value),
                oninput: (e) => {
                  // An empty or half-typed field is not a number yet: wait for the next keystroke.
                  // 空の欄や打ちかけの欄は、まだ数値ではありません。次の入力を待ちます。
                  if (e.target.value !== '' && Number.isFinite(Number(e.target.value))) change(s, shape.key, { [name]: Number(e.target.value) }, `${shape.key} ${name}`);
                },
              }),
        ],
      })),
    shape.tag === 'text'
      ? {
          tag: 'label',
          class: 'field',
          children: [
            U.uiText({ variant: 'muted', children: [t('text', { ja: '文字' })] }),
            U.uiInput({ value: shape.children[0], oninput: (e) => change(s, shape.key, { children: [e.target.value] }, `${shape.key} text`) }),
          ],
        }
      : null,
  ];

  const app = ricdom.createApp('#app', state, (s) => {
    const selected = s.shapes.find((shape) => shape.key === s.selected);
    return {
      tag: 'div',
      class: 'page',
      children: [
        { tag: 'h1', children: [t('ricdom — SVG editor', { ja: 'ricdom — SVG エディタ' })] },
        U.uiText({
          children: [t('Drag a shape to move it, or a corner of its frame to resize it. Click a shape, or its row in the list, to edit its attributes.', { ja: '図形をドラッグすると動き、枠の角をドラッグすると大きさが変わります。図形か、一覧の行をクリックすると、属性を編集できます。' })],
        }),
        {
          tag: 'div',
          class: 'editor',
          children: [
            U.uiPanel({
              children: [
                // The list: one button per shape, so a shape can be chosen with the keyboard too.
                // 一覧です。図形 1 つにつきボタン 1 つなので、キーボードでも図形を選べます。
                {
                  tag: 'div',
                  class: 'rows',
                  children: s.shapes.map((shape) => ({
                    tag: 'button',
                    key: shape.key,
                    class: shape.key === s.selected ? 'row is-selected' : 'row',
                    'aria-pressed': shape.key === s.selected ? 'true' : 'false',
                    onclick: () => { s.selected = shape.key; },
                    children: [markup(shape)],
                  })),
                },
                U.uiRow({
                  class: 'wrap',
                  children: Object.keys(NEW_SHAPE).map((tag) =>
                    U.uiButton({
                      children: [U.uiIcon(ICONS.plus, { size: 14 }), tag],
                      // The new shape goes to the end of the array, so it is drawn on top.
                      // 新しい図形は配列の末尾に入るので、いちばん手前に描かれます。
                      onclick: () => {
                        remember(s);
                        s.shapes = [...s.shapes, { key: nextKey, ...NEW_SHAPE[tag]() }];
                        s.selected = nextKey;
                        nextKey += 1;
                      },
                    }),
                  ),
                }),
                U.uiSeparator(),
                selected
                  ? U.uiCol({
                      children: [
                        ...fields(s, selected),
                        U.uiButton({
                          variant: 'ghost',
                          children: [U.uiIcon(ICONS['trash-2'], { size: 14 }), t('Delete this shape', { ja: 'この図形を削除' })],
                          onclick: () => {
                            remember(s);
                            s.shapes = s.shapes.filter((shape) => shape.key !== selected.key);
                            s.selected = null;
                          },
                        }),
                      ],
                    })
                  : U.uiText({ variant: 'muted', children: [t('Nothing is selected.', { ja: '何も選択されていません。' })] }),
              ],
            }),
            {
              tag: 'div',
              class: 'stage',
              children: [
                U.uiRow({
                  class: 'wrap',
                  children: [
                    U.uiButton({
                      disabled: s.undo.length === 0,
                      children: [U.uiIcon(ICONS['undo-2'], { size: 14 }), t('Undo', { ja: '元に戻す' })],
                      onclick: () => restore(s, 'undo', 'redo'),
                    }),
                    U.uiButton({
                      disabled: s.redo.length === 0,
                      children: [U.uiIcon(ICONS['redo-2'], { size: 14 }), t('Redo', { ja: 'やり直す' })],
                      onclick: () => restore(s, 'redo', 'undo'),
                    }),
                    U.uiCheckbox({
                      checked: s.grid,
                      children: [t(`Snap to a ${GRID}px grid`, { ja: `${GRID}px のグリッドに吸着` })],
                      onchange: (e) => { s.grid = e.target.checked; },
                    }),
                  ],
                }),
                drawing(s, selected),
              ],
            },
          ],
        },
      ],
    };
  });

  // Ctrl+Z and Ctrl+Y (on a Mac, Cmd+Z and Shift+Cmd+Z). While the focus is in a field that can
  // be typed in, the keys are left to the field: it undoes its own typing. `app` is the same
  // object as the `s` that the function above receives, so assigning to it draws again.
  // Ctrl+Z と Ctrl+Y です (Mac では Cmd+Z と Shift+Cmd+Z)。文字を打てる欄にフォーカスがある間は、
  // キーを欄に任せます。欄が自分の入力を元に戻します。`app` は、上の関数が受け取る `s` と
  // 同じオブジェクトなので、代入すると描き直されます。
  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.target.matches(':read-write')) return;
    const key = e.key.toLowerCase();
    const back = key === 'z' && !e.shiftKey;
    const forward = key === 'y' || (key === 'z' && e.shiftKey);
    if (!back && !forward) return;
    e.preventDefault();
    if (back) restore(app, 'undo', 'redo');
    else restore(app, 'redo', 'undo');
  });

  // Site helper: t() returns a plain string, so draw again once when the language changes.
  // サイトの補助: t() の戻り値はただの文字列なので、言語が変わったら 1 回描き直します。
  onLangChange(() => app.renderNow());
</script>
</body>
</html>
