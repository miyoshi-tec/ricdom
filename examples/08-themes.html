<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ricdom — 08 Themes and frosted glass (no build step)</title>
<!-- ricdom-ui.css styles ricdom's UI components (load it before your own CSS). _fonts.css only sets this site's fonts.
     ricdom-ui.css は ricdom の UI 部品の見た目です (自分の CSS より先に読み込みます)。_fonts.css はこのサイトのフォント設定だけです。 -->
<link rel="stylesheet" href="../dist/ricdom-ui.css">
<link rel="stylesheet" href="_fonts.css">
<style>
  html, body { min-height: 100%; }
  body { min-height: 100vh; }
  /* A stand-in desktop wallpaper made only of CSS gradients and blurred circles, so you can see
     that the translucent glass / glass-dark surfaces really blur what is behind them. In an
     Electron app with a transparent window, the real desktop shows through instead (Tutorial,
     section 6, "Frosted glass over the desktop").
     CSS のグラデーションとぼかした円だけで作った「壁紙」の代わりです。glass / glass-dark の半透明の面が、
     背後をちゃんとぼかしているかを目で確かめるためのものです。透明ウィンドウの Electron アプリでは、
     代わりに本物のデスクトップが透けて見えます (英語版チュートリアル 6 章「Frosted glass over the desktop」)。 */
  .wallpaper {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: linear-gradient(160deg, #0ea5e9 0%, #6366f1 45%, #ec4899 100%);
  }
  .wallpaper__blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.85;
  }
  .wallpaper__blob--1 { width: 380px; height: 380px; top: -80px; left: -60px; background: #f97316; }
  .wallpaper__blob--2 { width: 420px; height: 420px; bottom: -120px; right: -80px; background: #22d3ee; }
  .wallpaper__blob--3 { width: 300px; height: 300px; top: 38%; left: 55%; background: #a3e635; }
  .wallpaper__blob--4 { width: 260px; height: 260px; bottom: 8%; left: 8%; background: #f43f5e; }

  h1 { font-size: 1.15rem; }
  h2 { font-size: 0.95rem; margin: 1rem 0 4px; }
  .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin: 0.6rem 0; }
</style>
</head>
<body>
<!--
  08 Themes and frosted glass: the seven built-in themes, including the translucent glass and glass-dark.
  Floating surfaces (dialog, popup, dropdown, toast, tooltip, panel, tweak panel) blur what is behind
  them with backdrop-filter; controls (input, checkbox, range) deliberately do not (Spec, section 8).
  In your own app, applyTheme(element, { theme }) themes an element and everything inside it.
  No build step: two scripts (ricdom, then ricdom/ui) and one stylesheet.

  08 テーマとフロストガラス: 組み込みの 7 テーマです。半透明の glass と glass-dark も含みます。
  浮かぶ面 (ダイアログ・ポップアップ・ドロップダウン・トースト・ツールチップ・パネル・tweak パネル) は
  backdrop-filter で背後をぼかし、コントロール (入力欄・チェックボックス・スライダー) にはあえて掛けません (仕様 8 章)。
  自分のアプリでは、applyTheme(要素, { theme }) でその要素と中身全体にテーマを当てます。
  ビルド不要: <script> 2 本 (ricdom → ricdom/ui) と CSS 1 本で動きます。
-->
<div class="wallpaper">
  <div class="wallpaper__blob wallpaper__blob--1"></div>
  <div class="wallpaper__blob wallpaper__blob--2"></div>
  <div class="wallpaper__blob wallpaper__blob--3"></div>
  <div class="wallpaper__blob wallpaper__blob--4"></div>
</div>
<div id="app"></div>

<!-- Optional: highlight.js colours the code in this site's Source view. ricdom does not need it.
     任意: highlight.js はこのサイトの「ソース」表示を色分けします。ricdom 自体には不要です。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<!-- ricdom itself: the core first, then the UI components. They define the globals ricdom and ricdomUI.
     ricdom 本体: コア → UI 部品の順に読み込みます。グローバル変数 ricdom と ricdomUI ができます。 -->
<script src="../dist/ricdom.iife.min.js"></script>
<script src="../dist/ricdom-ui.iife.min.js"></script>
<!-- Docs-site helpers, not part of ricdom: the nav bar (theme, language, previous / next page) and t() for translations.
     このサイト専用の補助で、ricdom の一部ではありません: ナビバー (テーマ・言語・前後のページ) と翻訳用の t() です。 -->
<script src="_i18n.js"></script><script src="_samples.js"></script><script src="_nav.js"></script>
<script>
  // A short name for the UI components.
  // UI 部品を短い名前で呼べるようにします。
  const U = ricdomUI;

  // Site helper: t(text, { ja: '...' }) returns the text in the chosen language. Every string on this
  // page is used once, so its Japanese is written right where it is used.
  // サイトの補助: t(文字列, { ja: '…' }) は選択中の言語の文字列を返します。このページの文字列は
  // どれも 1 回しか使わないので、使う場所に日本語を書いています。
  const { t, onLangChange } = ricdomI18n;

  // Site helper: on this site the nav bar themes the whole page (it calls applyTheme on <body>).
  // The seven buttons below switch the theme through the same helper, so they and the nav bar agree.
  // サイトの補助: このサイトでは、ナビバーがページ全体にテーマを当てています (<body> に applyTheme)。
  // 下の 7 つのボタンも同じ補助を通して切り替えるので、ボタンとナビバーの表示が食い違いません。
  const nav = ricdomNav;

  const state = {
    theme: nav.getTheme(),
    name: 'Alex',
    subscribe: true,
    volume: 60,
    params: { size: 100, color: '#4f8ef7', rounded: 16 },
  };

  // Components that keep state are registered with app.use() in `setup` (bottom), before the first render.
  // 状態を持つ部品は、最初の描画の前に `setup` (下) の中で app.use() を使って登録します。
  let dlg, menu, dd, toast, tip, tweak;

  // One button per built-in theme; the current theme is drawn as the primary button.
  // 組み込みテーマごとに 1 つずつボタンを並べ、選択中のテーマを primary の見た目にします。
  const themeRow = (s) =>
    U.uiRow({
      children: [
        U.uiText({ variant: 'label', children: [t('Theme:', { ja: 'テーマ:' })] }),
        ...nav.THEMES.map((name) =>
          U.uiButton({
            variant: name === s.theme ? 'primary' : 'default',
            children: [name],
            onclick: () => nav.setTheme(name),
          }),
        ),
      ],
    });

  const app = ricdom.createApp(
    '#app',
    state,
    (s) =>
      U.uiPanel({
        style: { maxWidth: '760px', margin: '2rem auto' },
        children: [
          { tag: 'h1', children: [t('ricdom — themes and frosted glass', { ja: 'ricdom — テーマとフロストガラス' })] },
          U.uiText({
            children: [t(
              'Frosted glass (Windows 11 Acrylic / iOS translucency) style theme. Check that the wallpaper behind this panel looks blurred.',
              { ja: 'フロストガラス (Windows 11 Acrylic / iOS 半透明) 風テーマ。このパネル越しに背景の壁紙がぼけて見えることを確認してください。' },
            )],
          }),
          themeRow(s),
          U.uiSeparator(),

          // Each floating surface: open them under the glass themes to see the blur.
          // 浮かぶ面をひととおり並べています。glass 系のテーマで開くと、背後のぼかしが確かめられます。
          { tag: 'h2', children: [t('Floating surfaces (with backdrop-filter)', { ja: 'フローティング面 (backdrop-filter あり)' })] },
          {
            tag: 'div',
            class: 'row',
            children: [
              dlg({
                triggerChildren: [t('Open dialog', { ja: 'ダイアログを開く' })],
                title: t('Confirm', { ja: '確認' }),
                children: [t('The body of this dialog is frosted glass too.', { ja: 'このダイアログの本文の背景もフロストガラスです。' })],
                actions: [U.uiButton({ variant: 'primary', children: ['OK'], onclick: () => dlg.close() })],
              }),
              menu({
                trigger: [t('Popup menu ▾', { ja: 'ポップアップメニュー ▾' })],
                children: [
                  U.uiButton({ children: [t('Item A', { ja: '項目 A' })], onclick: () => toast.show(t('Selected item A', { ja: '項目 A を選択' })) }),
                  U.uiButton({ children: [t('Item B', { ja: '項目 B' })], onclick: () => toast.show(t('Selected item B', { ja: '項目 B を選択' })) }),
                ],
              }),
              dd({
                label: t('Dropdown: ', { ja: 'ドロップダウン: ' }) + s.name,
                chevron: true,
                children: ['name', 'date', 'size'].map((v) => U.uiButton({ children: [v], onclick: () => dd.close() })),
              }),
              U.uiButton({ children: [t('Show a toast', { ja: 'トーストを出す' })], onclick: () => toast.show(t('Saved', { ja: '保存しました' }), { type: 'success' }) }),
              tip({
                content: t('The tooltip is frosted glass too', { ja: 'ツールチップもフロストガラスです' }),
                children: [U.uiButton({ children: [t('Hover for a tooltip', { ja: 'ツールチップをホバー' })] })],
              }),
            ],
          },
          U.uiSeparator(),

          // Controls get a translucent background but no blur: blurring costs rendering time per element,
          // and a screen can hold many controls but only a few floating surfaces at once.
          // コントロールは半透明の背景だけで、ぼかしは掛けません。ぼかしは要素ごとに描画の負荷がかかり、
          // 浮かぶ面は同時に数枚なのに対して、コントロールは 1 画面に大量に並びうるためです。
          { tag: 'h2', children: [t(
            'Controls (no backdrop-filter, only a translucent rgba background)',
            { ja: 'コントロール (backdrop-filter は掛けない、半透明の rgba 背景のみ)' },
          )] },
          U.uiCol({
            children: [
              U.bindInput(s, 'name', { placeholder: t('Name', { ja: '名前' }) }),
              U.bindCheckbox(s, 'subscribe', { children: [t('Notify me', { ja: '通知を受け取る' })] }),
              U.bindRange(s, 'volume', { min: 0, max: 100 }),
            ],
          }),
          U.uiSeparator(),

          { tag: 'h2', children: [t('Tweak panel', { ja: 'tweak パネル' })] },
          tweak({ title: t('Parameters', { ja: 'パラメータ' }), data: s.params }),
          U.uiSeparator(),

          { tag: 'h2', children: [t('Legibility check', { ja: '可読性の確認' })] },
          U.uiText({
            children: [t(
              'Normal text on a translucent surface must stay clearly readable. The quick brown fox jumps over the lazy dog. 0123456789.',
              { ja: '半透明の面に乗った通常の文字も、はっきり読めることを確認してください。 The quick brown fox jumps over the lazy dog. 0123456789.' },
            )],
          }),
        ],
      }),
    {
      setup: (a) => {
        dlg = a.use(U.createDialog());
        menu = a.use(U.createPopup());
        dd = a.use(U.createDropdown());
        toast = a.use(U.createToast());
        tip = a.use(U.createTooltip());
        tweak = a.use(U.createTweakPanel());
      },
    },
  );

  // When the theme changes (from the nav bar or the buttons above), copy it into state so the
  // matching button is highlighted.
  // テーマが変わったら (ナビバーからでも上のボタンからでも)、state に写して該当するボタンを強調表示します。
  nav.onThemeChange((name) => { app.theme = name; });

  // Site helper: t() returns a plain string, so draw again once when the language changes.
  // サイトの補助: t() の戻り値はただの文字列なので、言語が変わったら 1 回描き直します。
  onLangChange(() => app.renderNow());
</script>
</body>
</html>
