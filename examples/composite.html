<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>RicDOM 2 — composite (splitter / scrollPane / collapseBox / accordion / tabs / dropdown / 行メニュー、no build step)</title>
<link rel="stylesheet" href="../dist/ricdom-ui.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  h1 { font-size: 1.1rem; }
  h2 { font-size: 0.95rem; margin: 1.5rem 0 4px; }
  section.demo { margin-bottom: 1.5rem; }
  .app-shell { max-width: 900px; margin: 0 auto; }
</style>
</head>
<body>
<!--
  利用側はビルド不要 (設計書 G1)。IIFE 2 本 (ricdom → ricdom/ui) + CSS <link> だけで
  状態を持つ部品群 (splitter/scrollPane/collapseBox/accordion/tabs/dropdown) と、
  行ごとの「…」メニュー (createPopup 1 つを openAt で開く) が一覧できることの証明 (設計書 §7)。
  npm install も webpack/vite の設定も不要 — このファイルをブラウザで開くだけで動く。
-->
<div id="app"></div>

<script src="../dist/ricdom.iife.min.js"></script>
<script src="../dist/ricdom-ui.iife.min.js"></script>
<script>
  const U = ricdomUI;

  const ICON_GEAR = { p: ['M12 2v2', 'M12 20v2', 'M4.93 4.93l1.41 1.41', 'M17.66 17.66l1.41 1.41', 'M2 12h2', 'M20 12h2', 'M4.93 19.07l1.41-1.41', 'M17.66 6.34l1.41-1.41', 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'] };

  const state = {
    theme: 'light',
    // splitter
    sidebarCollapsed: false,
    // scrollPane (チャット風)
    messages: ['ようこそ！', 'これは createScrollPane のデモです。', '下に送信すると自動で末尾までスクロールします。'],
    draft: '',
    // collapseBox
    detailsOpen: false,
    // dropdown
    sort: 'name',
    // 行の「…」メニュー (どの行に対するメニューか)
    menuRow: null,
  };

  // 状態を持つ部品はモジュールスコープの変数に保持し、render の外・createApp 直後に use() する
  // (設計書 §3.4)。render 内では毎回呼ぶだけ。
  let split, pane, box, acc, tabs, sortDD, actionsDD, rowMenu;

  const themeRow = (s) =>
    U.uiRow({
      children: [
        U.uiText({ variant: 'label', children: ['テーマ:'] }),
        ...['light', 'dark', 'teal', 'cyber', 'aqua'].map((t) =>
          U.uiButton({ variant: t === s.theme ? 'primary' : 'default', children: [t], onclick: () => { s.theme = t; } }),
        ),
      ],
    });

  const splitterDemo = (s) =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createSplitter'] },
        {
          tag: 'div',
          style: { height: '180px', border: '1px solid var(--ric-color-border)', borderRadius: 'var(--ric-radius)' },
          children: [
            split({
              collapsed: s.sidebarCollapsed,
              onCollapseChange: (v) => { s.sidebarCollapsed = v; },
              side: [{ tag: 'div', style: { padding: '8px' }, children: [U.uiText({ children: ['サイドパネル'] })] }],
              main: [{ tag: 'div', style: { padding: '8px' }, children: [U.uiText({ children: ['メインパネル (ドラッグ or 仕切り線にフォーカスして矢印キー)'] })] }],
            }),
          ],
        },
      ],
    });

  const scrollPaneDemo = (s) =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createScrollPane (follow: "bottom")'] },
        pane({
          style: { height: '140px', border: '1px solid var(--ric-color-border)', borderRadius: 'var(--ric-radius)', padding: '8px' },
          children: s.messages.map((m) => ({ tag: 'div', children: [m] })),
        }),
        U.uiRow({
          children: [
            U.bindInput(s, 'draft', { placeholder: 'メッセージ' }),
            U.uiButton({
              variant: 'primary',
              children: ['送信'],
              onclick: () => {
                if (!s.draft) return;
                s.messages = [...s.messages, s.draft];
                s.draft = '';
              },
            }),
            U.uiButton({ variant: 'ghost', children: ['末尾へ'], onclick: () => pane.scrollToBottom() }),
          ],
        }),
      ],
    });

  const collapseBoxDemo = (s) =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createCollapseBox'] },
        U.uiButton({
          id: 'details-toggle',
          'aria-expanded': String(s.detailsOpen),
          'aria-controls': box.idFor(),
          children: [s.detailsOpen ? '詳細を隠す' : '詳細を表示'],
          onclick: () => { s.detailsOpen = !s.detailsOpen; },
        }),
        box({ visible: s.detailsOpen, children: [U.uiPanel({ children: ['ここに詳細な説明文が入ります。開閉はアニメーションします。'] })] }),
      ],
    });

  const accordionDemo = () =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createAccordion'] },
        acc({
          items: [
            { id: 'q1', title: 'ビルドは必要ですか？', children: [U.uiText({ children: ['いいえ。IIFE 2 本 + CSS <link> だけで動きます。'] })] },
            { id: 'q2', title: '状態を持つ部品はどう登録しますか？', children: [U.uiText({ children: ['app.use(createX()) で明示登録します。'] })] },
          ],
          multi: false,
        }),
      ],
    });

  const tabsDemo = (s) =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createTabs (uncontrolled)'] },
        tabs({
          items: [
            { key: 'a', label: 'プロフィール', children: [U.uiText({ children: ['プロフィールタブの中身'] })] },
            { key: 'b', label: '通知設定', children: [U.uiText({ children: ['通知設定タブの中身'] })] },
            { key: 'c', label: '請求', children: [U.uiText({ children: ['請求タブの中身'] })] },
          ],
        }),
      ],
    });

  const dropdownDemo = (s) =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createDropdown (label / icon モード)'] },
        U.uiRow({
          children: [
            sortDD({
              label: '並び順: ' + s.sort,
              chevron: true,
              children: ['name', 'date', 'size'].map((v) =>
                U.uiButton({ variant: v === s.sort ? 'primary' : 'ghost', children: [v], onclick: () => { s.sort = v; sortDD.close(); } }),
              ),
            }),
            actionsDD({
              icon: U.uiIcon(ICON_GEAR, { size: 16 }),
              ghost: true,
              children: [
                U.uiButton({ variant: 'ghost', children: ['エクスポート'], onclick: () => actionsDD.close() }),
                U.uiButton({ variant: 'ghost', children: ['インポート'], onclick: () => actionsDD.close() }),
              ],
            }),
          ],
        }),
      ],
    });

  // 行ごとの「…」メニュー: 全行で createPopup を 1 つだけ使う (SPEC §10.3.1f)。trigger を渡さないので
  // 自分のボタンは描かず、各行の「…」から rowMenu.openAt(ボタン) で開く。下に入らなければ上に開き、
  // Escape・項目の選択・外側のクリック・行を含む領域のスクロールで閉じる。どの行かは s.menuRow で持つ。
  const rowMenuDemo = (s) =>
    U.uiCol({
      children: [
        { tag: 'h2', children: ['createPopup + openAt (行ごとの「…」メニュー)'] },
        rowMenu
          ? rowMenu({
              children: [
                U.uiButton({ children: ['名前を変更'], onclick: () => console.log('rename', s.menuRow) }),
                U.uiButton({ children: ['削除'], onclick: () => console.log('delete', s.menuRow) }),
              ],
            })
          : null,
        U.uiCol({
          children: ['行 A', '行 B'].map((row) => ({
            tag: 'div',
            style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 8px', border: '1px solid var(--ric-color-border)', borderRadius: 'var(--ric-radius)' },
            children: [
              row,
              U.uiButton({
                variant: 'ghost',
                'aria-haspopup': 'menu',
                'aria-label': '行の操作',
                children: ['⋯'],
                onclick: (e) => {
                  s.menuRow = row;
                  rowMenu.openAt(e.currentTarget);
                },
              }),
            ],
          })),
        }),
      ],
    });

  // createApp は生成時に同期初回描画する (v1 踏襲) が、app.use() は createApp の
  // 戻り値を受け取った「後」でしか呼べない。つまり最初の render 呼び出し時点では
  // split/pane/box/... はまだ undefined — 各 xxxDemo() の中で毎回 undefined
  // チェックするのは冗長なので、ここで 1 箇所にまとめてガードする
  // (use() 直後に notify() で再描画がかかるので、次のフレームには全部揃う)。
  const allPartsReady = () => split && pane && box && acc && tabs && sortDD && actionsDD;

  const app = ricdom.createApp(
    '#app',
    state,
    (s) =>
      !allPartsReady()
        ? { tag: 'div' }
        : U.uiPanel({
        class: 'app-shell',
        style: { margin: '2rem auto' },
        children: [
          { tag: 'h1', children: ['RicDOM 2 — composite'] },
          themeRow(s),
          U.uiSeparator(),
          splitterDemo(s),
          U.uiSeparator(),
          scrollPaneDemo(s),
          U.uiSeparator(),
          collapseBoxDemo(s),
          U.uiSeparator(),
          accordionDemo(),
          U.uiSeparator(),
          tabsDemo(s),
          U.uiSeparator(),
          dropdownDemo(s),
          U.uiSeparator(),
          rowMenuDemo(s),
        ],
      }),
  );

  split = app.use(U.createSplitter({ side: 'left', size: 180, min: 100, max: 320 }));
  pane = app.use(U.createScrollPane({ follow: 'bottom' }));
  box = app.use(U.createCollapseBox());
  acc = app.use(U.createAccordion({ defaultOpen: { q1: true } }));
  tabs = app.use(U.createTabs());
  sortDD = app.use(U.createDropdown());
  actionsDD = app.use(U.createDropdown());
  rowMenu = app.use(U.createPopup());

  U.applyTheme(document.getElementById('app'), { theme: state.theme });
  const originalRender = app.render;
  app.render = (s) => {
    U.applyTheme(document.getElementById('app'), { theme: s.theme });
    return originalRender(s);
  };
</script>
</body>
</html>
